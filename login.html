<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#176f68"/><title>Sign in — HomeCare</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="login.css"/></head><body><main class="login-page"><a class="brand" href="index.html"><span>✦</span>HomeCare</a><section class="login-card"><p class="eyebrow">WELCOME BACK</p><h1>Sign in to HomeCare</h1><p class="intro">Your account automatically opens the right experience.</p><form id="loginForm"><label>Email or mobile number<input id="email" type="text" placeholder="you@example.com" required/></label><label>Password<input id="password" type="password" placeholder="Enter your password" required/></label><p class="error" id="error"></p><button type="submit">Sign in <span>→</span></button></form><p class="create">New customer? <button id="createAccount" type="button">Create your account</button></p></section><section class="demo"><p>TEST ACCOUNTS</p><button data-demo="customer@homecare.demo">Customer</button><button data-demo="employee@homecare.demo">Employee</button><button data-demo="store@homecare.demo">Store manager</button><button data-demo="admin@homecare.demo">Admin</button><small>Use any password while testing. Staff accounts are created and managed by the main admin.</small></section></main><script src="login.js"></script></body></html>
